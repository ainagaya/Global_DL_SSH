paths:
  weights_dir: ./model_weights
  logs_dir: ./loss_logs
  predictions_dir: ./predictions
  queries_dir: ./queries

logging:
  level: INFO

tracking:
  mlflow:
    enabled: false
    tracking_uri: ./mlruns
    experiment_name: Global_DL_SSH
    run_name:
    tags: {}
    log_params: true
    log_config_artifact: true
    log_checkpoints: true
    log_loss_csv: true
    log_prediction_artifacts: false

oceantaco:
  taco_path:

regions:
  global:
    bbox: [-180.0, 180.0, -60.0, 60.0]
  smoke_test:
    bbox: [90.0, 95.0, -5.0, 5.0]

queries:
  patch_size:
    value: 2.5
    unit: deg
  land_mask_path:
  max_land_fraction: 0.6
  max_spatial_overlap: 1.0
  oversample_factor: 2.0
  spatial_overlap: 0.25
  temporal_stride_days: 1
  verbose: true

data:
  sequence_length: 3
  target_index: 1
  temporal_agg: stack
  grid:
    height: 64
    width: 64
  inputs:
    - key: l3_ssh
      normalize:
        mean: 0.074
        std: 0.0986
        mask_zeros: true
    - key: l4_sst
      normalize:
        mean: 20.157
        std: 8.726
        min_valid: -5.0
        mask_zeros: true
  targets:
    - key: l3_swot
      normalize:
        mean: 0.074
        std: 0.0986
        mask_zeros: true

splits:
  train:
    strategy: training
    start_date: 2025-05-01
    end_date: 2025-05-07
    n_queries: 12
    regions:
      - smoke_test
  validation:
    strategy: evaluation
    start_date: 2025-05-08
    end_date: 2025-05-10
    spatial_overlap: 0.25
    temporal_stride_days: 1
    regions:
      - smoke_test
  test:
    strategy: evaluation
    start_date: 2025-05-11
    end_date: 2025-05-25
    spatial_overlap: 0.25
    temporal_stride_days: 1
    regions:
      - smoke_test

model:
  type: gsta
  hidden_spatial: 4
  hidden_temporal: 48
  spatial_depth: 2
  temporal_depth: 2
  drop: 0.0
  drop_path: 0.0

training:
  batch_size: 1
  num_workers: 0
  learning_rate: 0.001
  epochs: 1
  amp: false
  shuffle: false
  seed: 42
  checkpoint_name: simvp_oceantaco_smoke

prediction:
  split: test
  batch_size: 1
  allow_empty_inputs: true
